# Decap CMS config — edits the same markdown files in src/content/site/
# that the Astro site reads. See ADMIN-SETUP.md at the project root for how
# to go from "works on my laptop" to a real login at yoursite.com/admin.

backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME   # <-- replace after creating the GitHub repo
  branch: main
  base_url: https://your-oauth-proxy.example.com   # <-- replace with your OAuth proxy URL (see ADMIN-SETUP.md)

# Lets this same config work with zero setup on your own machine:
# run `npx decap-server` alongside `npm run dev`, then open /admin.
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: simple

collections:
  - name: "site"
    label: "Site Content"
    folder: "src/content/site"
    create: false
    delete: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}} ({{lang}}/{{section}})"
    sortable_fields: ["title", "lang", "section", "price"]
    view_filters:
      - label: "Tours"
        field: section
        pattern: "tours"
      - label: "Cars"
        field: section
        pattern: "cars"
      - label: "Pages"
        field: section
        pattern: "pages"
      - label: "English"
        field: lang
        pattern: "en"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Language", name: "lang", widget: "select", options: ["en", "fr", "es", "it", "pt-br"] }
      - { label: "Section", name: "section", widget: "select", options: ["pages", "tours", "cars"] }
      - { label: "Slug (pslug)", name: "pslug", widget: "string" }
      - { label: "URL Path", name: "urlPath", widget: "string" }
      - { label: "Price (EUR, number only)", name: "price", widget: "number", required: false, value_type: "float" }
      - { label: "Duration", name: "duration", widget: "string", required: false }
      - { label: "Tag", name: "tag", widget: "string", required: false }
      - { label: "Source URL (original page)", name: "source", widget: "string", required: false }

      - { label: "Rating (0-5)", name: "rating", widget: "number", required: false, value_type: "float" }
      - { label: "Review Count", name: "reviewCount", widget: "number", required: false, value_type: "int" }
      - label: "Rating Breakdown (0-5 each)"
        name: "ratingBreakdown"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Hotels", name: "hotels", widget: "number", value_type: "float" }
          - { label: "Guides", name: "guides", widget: "number", value_type: "float" }
          - { label: "Transport", name: "transport", widget: "number", value_type: "float" }
          - { label: "Activities", name: "activities", widget: "number", value_type: "float" }
      - { label: "Tour Code", name: "tourCode", widget: "string", required: false }
      - { label: "Tour Type", name: "tourType", widget: "string", required: false }
      - { label: "Free Cancellation Window", name: "cancellation", widget: "string", required: false }
      - { label: "Languages Spoken", name: "languagesSpoken", widget: "string", required: false }
      - { label: "Google Maps Embed URL", name: "mapUrl", widget: "string", required: false }

      - label: "Pricing Mode"
        name: "pricingMode"
        widget: "select"
        default: "group"
        options:
          - { label: "Group — flat per-person price × travelers", value: "group" }
          - { label: "Tiers — manual price per group size", value: "tiers" }
          - { label: "Auto — hotel/night + transport/day formula", value: "auto" }
        hint: "Group: uses the Price field above × travelers, unchanged for any group size. Tiers: set the table below. Auto: set the formula below."

      - label: "Price Tiers (used when Pricing Mode = tiers)"
        name: "priceTiers"
        widget: "list"
        required: false
        summary: "{{fields.people}} people = €{{fields.perPerson}}/person"
        fields:
          - { label: "Number of People", name: "people", widget: "number", value_type: "int" }
          - { label: "Price Per Person (EUR)", name: "perPerson", widget: "number", value_type: "float" }

      - label: "Auto-Pricing Formula (used when Pricing Mode = auto)"
        name: "autoPricing"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Days", name: "days", widget: "number", value_type: "int" }
          - { label: "Nights", name: "nights", widget: "number", value_type: "int" }
          - { label: "Standard Hotel (EUR/person/night)", name: "hotelPerNight", widget: "number", value_type: "float", default: 40 }
          - { label: "Superior Upgrade (EUR/person/night, added to hotel rate)", name: "superiorSurcharge", widget: "number", value_type: "float", default: 50 }
          - { label: "Transport (EUR/day, flat — split across travelers)", name: "transportPerDay", widget: "number", value_type: "float", default: 300 }

      - label: "Offer Desert Extras (Quad Biking / Dune Buggy)"
        name: "hasDesertExtras"
        widget: "boolean"
        default: false
        hint: "Only enable for tours that actually visit the desert/dunes."

      - label: "Overview (HTML)"
        name: "overviewHtml"
        widget: "text"
        required: false
        hint: "Raw HTML paragraphs shown in the Overview section. Wrap paragraphs in <p>...</p>."

      - { label: "Price Table Heading", name: "priceHeading", widget: "string", required: false }
      - label: "Price Table Rows"
        name: "priceRows"
        widget: "list"
        required: false
        summary: "{{fields.row}}"
        field: { label: "Row (one cell per column)", name: "row", widget: "list", field: { label: "Cell", name: "cell", widget: "string" } }

      - { label: "Notes Heading", name: "notesHeading", widget: "string", required: false }
      - label: "Notes (HTML list items)"
        name: "notes"
        widget: "list"
        required: false
        field: { label: "Note", name: "note", widget: "text" }

      - label: "Highlights"
        name: "highlights"
        widget: "list"
        required: false
        field: { label: "Highlight", name: "highlight", widget: "string" }

      - label: "Day-by-Day Itinerary"
        name: "itinerary"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Day Title", name: "title", widget: "string" }
          - { label: "Day Description (HTML)", name: "html", widget: "text" }

      - label: "Included"
        name: "included"
        widget: "list"
        required: false
        field: { label: "Item", name: "item", widget: "string" }

      - label: "Not Included"
        name: "excluded"
        widget: "list"
        required: false
        field: { label: "Item", name: "item", widget: "string" }

      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        summary: "{{fields.q}}"
        fields:
          - { label: "Question", name: "q", widget: "string" }
          - { label: "Answer (HTML)", name: "aHtml", widget: "text" }

      - label: "Reviews"
        name: "reviews"
        widget: "list"
        required: false
        summary: "{{fields.name}} — {{fields.stars}}★"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Date", name: "date", widget: "string" }
          - { label: "Stars (1-5)", name: "stars", widget: "number", value_type: "int", default: 5 }
          - { label: "Likes", name: "likes", widget: "number", value_type: "int", default: 0, required: false }
          - { label: "Review Title", name: "title", widget: "string", required: false }
          - { label: "Review Text", name: "text", widget: "text" }

      - label: "Car: Badges"
        name: "carBadges"
        widget: "list"
        required: false
        field: { label: "Badge", name: "badge", widget: "string" }
      - { label: "Car: Category", name: "carCategory", widget: "string", required: false }
      - label: "Car: Features"
        name: "carFeatures"
        widget: "list"
        required: false
        field: { label: "Feature", name: "feature", widget: "string" }

      - label: "Icon Grid (feature cards — About page, etc.)"
        name: "iconGrid"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Icon (see Icon.astro for names, e.g. globe, star, shield)", name: "icon", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }

      - label: "Car Listings (fleet grid — Car Rental page)"
        name: "carListings"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Icon (car, van, or bus)", name: "icon", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - label: "Specs"
            name: "specs"
            widget: "list"
            required: false
            field: { label: "Spec", name: "spec", widget: "string" }
          - { label: "Price (e.g. 130€/Day)", name: "price", widget: "string", required: false }
          - { label: "Link to this car's own page (optional)", name: "href", widget: "string", required: false }
          - { label: "Book link", name: "bookHref", widget: "string", required: false }

      - label: "SEO Title Override"
        name: "metaTitle"
        widget: "string"
        required: false
        hint: "Leave blank to use the auto-generated title (page title + \" | Morocco Excursions\")."
      - label: "SEO Description Override"
        name: "metaDescription"
        widget: "text"
        required: false
        hint: "Leave blank to use the auto-generated description built from the page's own content."

      - label: "Page Body (markdown — info pages only)"
        name: "body"
        widget: "markdown"
        required: false

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "src/content/settings/general.yml"
        fields:
          - { label: "PayPal Mode", name: "paypalMode", widget: "select", options: [{ label: "Sandbox (test — never charges real money)", value: "sandbox" }, { label: "Live (real payments)", value: "live" }], hint: "Sandbox always uses PayPal's public test id regardless of the Client ID below — safe to leave as-is until you're ready to accept real payments." }
          - { label: "PayPal Live Client ID (from developer.paypal.com → Apps & Credentials)", name: "paypalClientId", widget: "string", hint: "Only used when Mode above is set to Live." }
          - { label: "Phone (display)", name: "phone", widget: "string" }
          - { label: "Phone link (tel:...)", name: "phoneHref", widget: "string" }
          - { label: "WhatsApp link (https://wa.me/...)", name: "whatsappHref", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Default SEO Description (used when a page has no override and no auto-generated text)", name: "defaultMetaDescription", widget: "text", required: false }
          - { label: "Bookings/Messages Endpoint (Worker URL, see BOOKINGS-SETUP.md)", name: "submitEndpoint", widget: "string", required: false, hint: "Leave blank until you've deployed worker/ — the site works fine without it." }

  - name: "bookings"
    label: "Bookings"
    folder: "src/content/bookings"
    create: false
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    summary: "{{fields.subject}} — {{fields.name}} ({{fields.status}})"
    sortable_fields: ["submittedAt", "status", "name"]
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Email", name: "email", widget: "string" }
      - { label: "Phone", name: "phone", widget: "string", required: false }
      - { label: "Tour / subject", name: "subject", widget: "string", required: false }
      - { label: "Message", name: "message", widget: "text", required: false }
      - { label: "Submitted at", name: "submittedAt", widget: "datetime" }
      - label: "Status"
        name: "status"
        widget: "select"
        default: "new"
        options: ["new", "contacted", "booked", "archived"]
      - { label: "Full raw submission", name: "raw", widget: "text", required: false }

  - name: "messages"
    label: "Contact Messages"
    folder: "src/content/messages"
    create: false
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    summary: "{{fields.name}} — {{fields.status}}"
    sortable_fields: ["submittedAt", "status", "name"]
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Email", name: "email", widget: "string" }
      - { label: "Phone", name: "phone", widget: "string", required: false }
      - { label: "Subject", name: "subject", widget: "string", required: false }
      - { label: "Message", name: "message", widget: "text", required: false }
      - { label: "Submitted at", name: "submittedAt", widget: "datetime" }
      - label: "Status"
        name: "status"
        widget: "select"
        default: "new"
        options: ["new", "contacted", "booked", "archived"]
      - { label: "Full raw submission", name: "raw", widget: "text", required: false }
